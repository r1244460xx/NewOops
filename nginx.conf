worker_processes  1;
error_log  /tmp/nginx_mroops_error.log;
pid        /tmp/nginx_mroops.pid;

events {
    worker_connections  1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /tmp/nginx_mroops_access.log;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for speedy asset transfer
    gzip  on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       8088;
        server_name  localhost;

        # 1. Frontend static files (HTML, CSS, JS, Audio, Config)
        location / {
            root   /Users/severus/Oops;
            index  index.html;
            try_files $uri $uri/ =404;
        }

        # 2. WebSocket reverse proxy for LAN 1v1 Multiplayer
        location /ws {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 3. Game Settings & LAN IP API
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
        }
    }
}
