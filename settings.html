<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Oops!! - 遊戲數值設定後台</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    /* Standalone Settings Page Styles */
    body {
      overflow-y: auto !important;
      padding: 24px 16px 80px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .settings-container {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      color: var(--dark-text);
      border-radius: var(--border-radius-lg);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .settings-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 2px solid #e5e5ea;
      padding-bottom: 14px;
    }

    .settings-title-group h1 {
      font-family: var(--font-display);
      font-size: 26px;
      color: #1c1c1e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #c8e6c9;
      letter-spacing: 0.5px;
    }

    .settings-intro {
      font-size: 13px;
      color: #636366;
      line-height: 1.45;
      background: #f8f9fa;
      border-left: 4px solid #007aff;
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
    }

    /* Fixed Sticky Bottom Action Bar */
    .settings-sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(18, 24, 38, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.4);
    }

    .sticky-bar-inner {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .sticky-actions-left {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .live-save-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(52, 199, 89, 0.18);
      color: #34c759;
      border: 1px solid rgba(52, 199, 89, 0.4);
      transition: all 0.25s ease;
    }

    .live-save-pill.saving {
      background: rgba(255, 159, 10, 0.2);
      color: #ff9f0a;
      border-color: rgba(255, 159, 10, 0.5);
      animation: pulse 0.8s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.65; }
      to { opacity: 1; }
    }

    .config-select-input {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #1c1c1e;
      background: #f2f2f7;
      border: 2px solid #e5e5ea;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .config-select-input:focus {
      border-color: #007aff;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    /* Status notification */
    #status-banner {
      display: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      animation: fadeIn 0.25s ease;
    }

    #status-banner.success {
      display: block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    #status-banner.error {
      display: block;
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Password Modal & Auth Pill */
    .btn-auth-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid #d1d1d6;
      background: #f2f2f7;
      color: #1c1c1e;
      transition: all 0.2s ease;
    }

    .btn-auth-pill:hover {
      background: #e5e5ea;
      transform: translateY(-1px);
    }

    .btn-auth-pill.locked {
      background: #fff3cd;
      color: #856404;
      border-color: #ffeeba;
    }

    .btn-auth-pill.unlocked {
      background: #e8f5e9;
      color: #2e7d32;
      border-color: #c8e6c9;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }

    .modal-dialog {
      background: #ffffff;
      color: #1c1c1e;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: modalSlideUp 0.25s ease;
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 20px;
      color: #1c1c1e;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-desc {
      font-size: 13.5px;
      color: #636366;
      line-height: 1.5;
      margin: 0;
    }

    .modal-input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      color: #1c1c1e;
      background: #f2f2f7;
      border: 2px solid #e5e5ea;
      border-radius: 10px;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    .modal-input:focus {
      border-color: #007aff;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
    }

    .modal-error {
      font-size: 12.5px;
      color: #d32f2f;
      font-weight: 600;
      padding: 8px 12px;
      background: #ffebee;
      border-radius: 6px;
      border-left: 3px solid #d32f2f;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="settings-container">
    <!-- Top Bar -->
    <header class="settings-topbar">
      <div class="settings-title-group">
        <h1>⚙️ 遊戲參數設定後台</h1>
        <span class="settings-badge">🟢 實時雙向連動 (Live Sync)</span>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button id="btn-auth-manage" class="btn-auth-pill" style="display:none;" title="管理員權限設定">
          <span id="auth-pill-icon">🔐</span> <span id="auth-pill-text">管理密碼</span>
        </button>
        <a href="index.html" target="_blank" class="btn btn-accent" style="text-decoration:none; font-size:13px; padding:8px 16px;">
          🎮 開啟遊戲主畫面分頁
        </a>
      </div>
    </header>

    <div class="settings-intro">
      ⚡ <strong>自動持久化已啟用</strong>：您可以在 Chrome 中將本頁面與遊戲分頁並排顯示。任何參數<strong>只要拉動滑桿或修改數字，系統便會立即秒級自動持久化保存至硬碟 config.json 與遊戲分頁</strong>，完全不需額外點選「儲存設定」！
    </div>

    <!-- Status Alert Banner -->
    <div id="status-banner"></div>

    <!-- Parameter Inputs Group Container -->
    <div id="settings-items-container" style="display:flex; flex-direction:column; gap:14px;">
      <!-- Populated dynamically from CONFIG_SCHEMA -->
    </div>
  </div>

  <!-- Fixed Sticky Bottom Action Bar -->
  <footer class="settings-sticky-bar">
    <div class="sticky-bar-inner">
      <div class="sticky-actions-left">
        <button id="btn-reset" class="btn btn-secondary config-btn-sm" title="還原所有出廠預設值">🔄 重置預設值</button>
        <button id="btn-download" class="btn btn-secondary config-btn-sm" title="下載備份 config.json">📥 下載 config.json</button>
        <button id="btn-copy" class="btn btn-secondary config-btn-sm" title="複製 JSON 代碼">📋 複製 JSON</button>
      </div>
      <div id="live-save-status" class="live-save-pill">🟢 自動持久化已開啟（拉動立即自動保存）</div>
    </div>
  </footer>

  <!-- Toast Popup -->
  <div id="toast" class="config-toast"></div>

  <!-- Admin Password Authorization Modal -->
  <div id="password-modal" class="modal-overlay" style="display:none;">
    <div class="modal-dialog">
      <h3 class="modal-title">🔐 伺服器修改授權</h3>
      <p class="modal-desc">
        伺服器已開啟管理員密碼保護。請輸入管理密碼，驗證成功後將<strong>自動儲存在此瀏覽器</strong>（日後無需重複輸入）。
      </p>
      <div class="modal-body" style="display:flex; flex-direction:column; gap:8px;">
        <input type="password" id="admin-password-input" class="modal-input" placeholder="請輸入管理員密碼..." autocomplete="current-password">
        <div id="password-modal-error" class="modal-error" style="display:none;"></div>
      </div>
      <div class="modal-actions">
        <button id="btn-clear-password" class="btn btn-secondary config-btn-sm" style="margin-right:auto; display:none;">清除已存密碼</button>
        <button id="btn-cancel-password" class="btn btn-secondary config-btn-sm">取消</button>
        <button id="btn-submit-password" class="btn btn-primary config-btn-sm">確認並儲存</button>
      </div>
    </div>
  </div>

  <!-- Scripts in dependency order -->
  <script src="js/config.js?v=2.8"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('settings-items-container');
      const statusBanner = document.getElementById('status-banner');
      const liveSaveStatus = document.getElementById('live-save-status');
      const btnReset = document.getElementById('btn-reset');
      const btnDownload = document.getElementById('btn-download');
      const btnCopy = document.getElementById('btn-copy');
      const toastEl = document.getElementById('toast');

      let currentCategory = '';
      const inputRefs = {};

      // 1. Build UI from CONFIG_SCHEMA
      window.CONFIG_SCHEMA.forEach((item) => {
        if (item.category !== currentCategory) {
          currentCategory = item.category;
          const catHeader = document.createElement('div');
          catHeader.className = 'config-category-header';
          catHeader.textContent = currentCategory;
          container.appendChild(catHeader);
        }

        const card = document.createElement('div');
        card.className = 'config-item-card';

        const info = document.createElement('div');
        info.className = 'config-item-info';
        info.innerHTML = `
          <div>
            <span class="config-item-label">${item.label}</span>
            ${item.unit ? `<span class="config-item-unit">(${item.unit})</span>` : ''}
          </div>
        `;

        const desc = document.createElement('div');
        desc.className = 'config-item-desc';
        desc.textContent = item.desc;

        const controlRow = document.createElement('div');
        controlRow.className = 'config-control-row';

        const currentVal = window.configManager.get(item.key);

        if (item.type === 'select') {
          const select = document.createElement('select');
          select.className = 'config-select-input';
          item.options.forEach((opt) => {
            const opEl = document.createElement('option');
            opEl.value = opt.value;
            opEl.textContent = opt.label;
            if (String(opt.value) === String(currentVal)) opEl.selected = true;
            select.appendChild(opEl);
          });
          select.addEventListener('change', () => {
            window.configManager.set(item.key, select.value);
          });
          controlRow.appendChild(select);
          inputRefs[item.key] = { select, isSelect: true };
        } else {
          // Slider
          const slider = document.createElement('input');
          slider.type = 'range';
          slider.className = 'config-slider';
          slider.min = item.min;
          slider.max = item.max;
          slider.step = item.step;
          slider.value = currentVal;

          // Number Input (only numbers)
          const numInput = document.createElement('input');
          numInput.type = 'number';
          numInput.className = 'config-num-input';
          numInput.placeholder = item.placeholder;
          numInput.min = item.min;
          numInput.max = item.max;
          numInput.step = item.step;
          numInput.value = currentVal;

          // Sync Slider -> Input
          slider.addEventListener('input', () => {
            numInput.value = slider.value;
            window.configManager.set(item.key, slider.value);
          });

          // Sync Input -> Slider
          numInput.addEventListener('input', () => {
            const val = parseFloat(numInput.value);
            if (!isNaN(val)) {
              slider.value = val;
              window.configManager.set(item.key, val);
            }
          });

          controlRow.appendChild(slider);
          controlRow.appendChild(numInput);

          inputRefs[item.key] = { slider, numInput, isSelect: false };
        }

        card.appendChild(info);
        card.appendChild(desc);
        card.appendChild(controlRow);

        container.appendChild(card);
      });

      function refreshUI() {
        window.CONFIG_SCHEMA.forEach((item) => {
          const refs = inputRefs[item.key];
          if (refs) {
            const val = window.configManager.get(item.key);
            if (refs.isSelect) {
              refs.select.value = val;
            } else {
              refs.slider.value = val;
              refs.numInput.value = val;
            }
          }
        });
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastEl._timer);
        toastEl._timer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2200);
      }

      function showBanner(msg, isSuccess = true) {
        statusBanner.textContent = msg;
        statusBanner.className = isSuccess ? 'success' : 'error';
        clearTimeout(statusBanner._timer);
        statusBanner._timer = setTimeout(() => {
          statusBanner.style.display = 'none';
        }, 4000);
      }

      // Listen to ConfigManager auto-persistence status changes
      window.configManager.onStatusChange((info) => {
        if (!liveSaveStatus) return;
        if (info.status === 'saving') {
          liveSaveStatus.className = 'live-save-pill saving';
          liveSaveStatus.style.background = '';
          liveSaveStatus.style.color = '';
          liveSaveStatus.style.borderColor = '';
          liveSaveStatus.textContent = info.message;
        } else if (info.status === 'saved') {
          liveSaveStatus.className = 'live-save-pill';
          liveSaveStatus.style.background = '';
          liveSaveStatus.style.color = '';
          liveSaveStatus.style.borderColor = '';
          liveSaveStatus.textContent = info.message;
        } else if (info.status === 'unauthorized') {
          liveSaveStatus.className = 'live-save-pill saving';
          liveSaveStatus.style.background = 'rgba(255, 59, 48, 0.2)';
          liveSaveStatus.style.color = '#ff3b30';
          liveSaveStatus.style.borderColor = 'rgba(255, 59, 48, 0.5)';
          liveSaveStatus.textContent = '🔒 需要管理員密碼 (未寫入伺服器)';
          openPasswordModal('🔒 伺服器受管理員密碼保護，請輸入密碼以授權儲存');
        }
      });

      // Auth & Password Modal Handling
      const passwordModal = document.getElementById('password-modal');
      const passwordInput = document.getElementById('admin-password-input');
      const passwordError = document.getElementById('password-modal-error');
      const btnAuthManage = document.getElementById('btn-auth-manage');
      const authPillIcon = document.getElementById('auth-pill-icon');
      const authPillText = document.getElementById('auth-pill-text');
      const btnSubmitPassword = document.getElementById('btn-submit-password');
      const btnCancelPassword = document.getElementById('btn-cancel-password');
      const btnClearPassword = document.getElementById('btn-clear-password');

      async function updateAuthPill() {
        const authStatus = await window.configManager.checkAuthStatus();
        if (authStatus.protected) {
          btnAuthManage.style.display = 'inline-flex';
          if (authStatus.authenticated) {
            btnAuthManage.className = 'btn-auth-pill unlocked';
            authPillIcon.textContent = '🔓';
            authPillText.textContent = '密碼已記住';
            btnAuthManage.title = '管理員密碼已儲存在此瀏覽器，點擊可重設或清除';
          } else {
            btnAuthManage.className = 'btn-auth-pill locked';
            authPillIcon.textContent = '🔐';
            authPillText.textContent = '尚未驗證';
            btnAuthManage.title = '伺服器已開啟密碼保護，點擊以輸入密碼';
          }
        } else {
          btnAuthManage.style.display = 'none';
        }
      }

      function openPasswordModal(errorMsg = '') {
        const currentPwd = window.configManager.getAdminPassword();
        passwordInput.value = currentPwd || '';
        btnClearPassword.style.display = currentPwd ? 'inline-block' : 'none';
        if (errorMsg) {
          passwordError.textContent = errorMsg;
          passwordError.style.display = 'block';
        } else {
          passwordError.style.display = 'none';
        }
        passwordModal.style.display = 'flex';
        setTimeout(() => {
          passwordInput.focus();
          if (passwordInput.value) passwordInput.select();
        }, 50);
      }

      function closePasswordModal() {
        passwordModal.style.display = 'none';
        passwordError.style.display = 'none';
      }

      btnAuthManage.addEventListener('click', () => {
        openPasswordModal();
      });

      btnCancelPassword.addEventListener('click', () => {
        closePasswordModal();
      });

      btnClearPassword.addEventListener('click', async () => {
        window.configManager.setAdminPassword('');
        passwordInput.value = '';
        closePasswordModal();
        showToast('已清除本機記住的密碼');
        await updateAuthPill();
      });

      passwordModal.addEventListener('click', (e) => {
        if (e.target === passwordModal) {
          closePasswordModal();
        }
      });

      async function submitPassword() {
        const pwd = passwordInput.value.trim();
        window.configManager.setAdminPassword(pwd);
        btnSubmitPassword.disabled = true;
        btnSubmitPassword.textContent = '驗證中...';
        try {
          const res = await window.configManager.saveToDisk();
          if (res && res.unauthorized) {
            passwordError.textContent = '❌ 密碼錯誤，請重新輸入！';
            passwordError.style.display = 'block';
            passwordInput.focus();
            passwordInput.select();
          } else {
            closePasswordModal();
            showToast('✅ 密碼驗證成功並已記住，設定已儲存！');
            await updateAuthPill();
          }
        } finally {
          btnSubmitPassword.disabled = false;
          btnSubmitPassword.textContent = '確認並儲存';
        }
      }

      btnSubmitPassword.addEventListener('click', submitPassword);
      passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          submitPassword();
        } else if (e.key === 'Escape') {
          closePasswordModal();
        }
      });

      // Update auth status pill on page load
      updateAuthPill();

      // Reset button
      btnReset.addEventListener('click', () => {
        window.configManager.resetDefaults();
        refreshUI();
        showBanner('🔄 已成功恢復出廠預設值！', true);
        showToast('已恢復出廠預設值！');
      });

      // Download button
      btnDownload.addEventListener('click', () => {
        window.configManager.downloadJSON();
        showToast('📥 config.json 下載完成！');
      });

      // Copy button
      btnCopy.addEventListener('click', () => {
        window.configManager.copyJSON().then(() => {
          showToast('📋 config.json 代碼已複製！');
        }).catch(() => {
          showToast('複製失敗');
        });
      });

      // Refresh if another tab changes values
      window.configManager.onChange(() => {
        refreshUI();
      });
    });
  </script>
</body>
</html>
